# La web del reparto: ficheros estáticos y nada más. La API y el sincronizador son
# públicos y el navegador los llama directo — aquí NO hay proxy hacia ellos, igual que
# en notify. Un proxy más es una pieza más que se puede caer y un sitio más donde se
# pierde una cabecera.

server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Comprimir. En la conexión de allá esto no es un adorno: `main.dart.js` baja de
    # varios megas a unos cientos de kilobytes. El .wasm también comprime bien.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/wasm image/svg+xml
                      application/manifest+json;

    # Por si la tabla de tipos de la imagen no lo trae: un .wasm servido como
    # application/octet-stream no lo instancia el navegador y la base local no abre.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=3600";
    }

    # LO QUE NO SE PUEDE CACHEAR. Flutter no le pone huella al nombre de estos ficheros:
    # si el navegador se guarda un `flutter_bootstrap.js` viejo, el aparato se queda con
    # la versión anterior sin que nadie se entere y sin ningún error a la vista.
    #
    # `main.dart.js` FALTABA EN ESTA LISTA, y es el peor de todos: **es la aplicación
    # entera**. Pasó el 16/09: se desplegó todo lo del día anterior, el servidor servía el
    # fichero nuevo —comprobado byte a byte contra el contenedor— y el navegador seguía
    # enseñando el de ayer. Se vio porque la pantalla decía «Sin descargar todavía», un
    # texto que **ya no existe** en el fichero servido: si el texto no está y aun así se
    # pinta, lo que se está ejecutando no es lo que se sirvió.
    #
    # Y no basta con recargar: el HTML llega fresco, pide `main.dart.js` con el mismo
    # nombre de siempre, y el navegador lo da por bueno sin preguntar. Cuatro horas de una
    # aplicación vieja hablando con una API nueva, que es peor que no haber desplegado.
    #
    # Entran también los `.part.js` (Flutter parte el código en trozos con nombres
    # `main.dart.js_1.part.js`) y el favicon, que tampoco lleva huella y por eso el 16/09
    # seguía saliendo el de Flutter después de cambiarlo.
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json|favicon\.png|main\.dart\.js.*)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # El resto, una hora. Suficiente para que un despliegue llegue el mismo día y para
    # que abrir la aplicación diez veces no vuelva a bajar el mundo.
    location / {
        add_header Cache-Control "public, max-age=3600";
        # UNA SOLA PÁGINA: cualquier ruta la resuelve el enrutador de Flutter dentro del
        # navegador. Sin esto, recargar en /rutas/3 da 404 y el logístico ve una página
        # de nginx en vez de su trabajo.
        try_files $uri $uri/ /index.html;
    }

    # Para el sondeo del desplegador y para poder distinguir «nginx está vivo» de «la
    # API no contesta», que desde la pantalla se parecen mucho.
    location = /nginx-salud {
        access_log off;
        default_type text/plain;
        return 200 "bien\n";
    }

    # AISLAMIENTO DE ORIGEN — apagado a propósito, y aquí está el porqué.
    #
    # Con estas dos cabeceras el navegador habilita SharedArrayBuffer y drift usa la
    # implementación compartida de OPFS. Sin ellas, drift se queda en OPFS con Web Locks,
    # que TAMBIÉN persiste: no se pierde nada, sólo se usa el camino de al lado.
    #
    # El riesgo de encenderlas es que `require-corp` bloquea cualquier recurso de otro
    # origen que no mande su permiso, y eso se ve como una pantalla en blanco sin error
    # entendible. Hoy el build va con `--no-web-resources-cdn` (CanvasKit es local) y la
    # aplicación no carga imágenes de fuera, así que se pueden encender — pero eso se
    # prueba en el navegador, mirando el aviso de «almacenamiento degradado» que la
    # propia aplicación escribe, y no se deja puesto «por si acaso».
    #
    # add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    # add_header Cross-Origin-Embedder-Policy "require-corp"  always;
}
