# La web del reparto: ficheros estáticos y nada más. La API y el sincronizador son
# públicos y el navegador los llama directo — aquí NO hay proxy hacia ellos, igual que
# en notify. Un proxy más es una pieza más que se puede caer y un sitio más donde se
# pierde una cabecera.

server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Comprimir. En la conexión de allá esto no es un adorno: `main.dart.js` baja de
    # varios megas a unos cientos de kilobytes. El .wasm también comprime bien.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/wasm image/svg+xml
                      application/manifest+json;

    # Por si la tabla de tipos de la imagen no lo trae: un .wasm servido como
    # application/octet-stream no lo instancia el navegador y la base local no abre.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=3600";
    }

    # LA PUERTA, Y SÓLO LA PUERTA, NO SE CACHEA.
    #
    # `index.html` es el único fichero cuya dirección no cambia nunca, así que es el único
    # que hay que volver a pedir siempre. Dentro lleva la HUELLA de esta compilación
    # (`deploy/Dockerfile.app`), y de ahí sale la dirección buena de todo lo demás.
    #
    # ## Por qué así y no prohibiendo la caché de todo
    #
    # El 16/09 se desplegó el trabajo de un día entero, los cuatro servicios quedaron
    # `done`, el servidor servía el fichero nuevo —comprobado byte a byte contra el
    # contenedor— y la pantalla seguía enseñando la aplicación del día anterior. Se vio
    # porque decía «Sin descargar todavía», un texto que ya NO EXISTE en el fichero
    # servido: si el texto no está y aun así se pinta, lo que corre no es lo que se sirvió.
    #
    # La primera reacción fue meter `main.dart.js` aquí, en la lista de lo que no se
    # cachea. Funciona, y es un mal negocio: son cinco megas que se vuelven a bajar en cada
    # recarga, por la conexión de allá, para protegerse de un problema que se puede quitar
    # de en medio. Con la huella, la caché deja de adivinar: si el código no cambió sirve
    # lo guardado al instante, y si cambió la dirección es otra y no hay copia vieja que
    # servir.
    #
    # `manifest.json` y `version.json` siguen aquí porque no los pide la aplicación sino el
    # navegador y el comprobador de versión, y ninguno de los dos pasa por `index.html`.
    location ~* ^/(index\.html|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # EL CÓDIGO, UN AÑO — porque lleva su huella y no puede desfasarse.
    #
    # `main.dart.js?v=<md5>` y `flutter_bootstrap.js?v=<md5>` los pide siempre alguien que
    # acaba de leer un `index.html` sin cachear, así que la dirección que se pide es
    # SIEMPRE la de la compilación que está puesta. Una copia guardada de esa dirección no
    # puede estar vieja: si el código cambió, lo que se pide es otra dirección.
    #
    # Antes era una hora para todo, que es el peor de los dos mundos: bastante para servir
    # una aplicación vieja después de desplegar, y poco para que abrirla diez veces no
    # vuelva a bajarse cinco megas por la conexión de allá.
    location ~* ^/(main\.dart\.js|flutter_bootstrap\.js) {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # LO DEMÁS, UN DÍA. Las tipografías, el `sqlite3.wasm`, CanvasKit y los iconos **no
    # llevan huella**, así que aquí sí hay que elegir un plazo.
    #
    # Un día, y no un año, porque un año depende de que alguien se acuerde de purgar el día
    # que cambie un icono — y acordarse es exactamente lo que no funciona. Un día es de
    # sobra para que abrir la aplicación veinte veces no baje nada, y poco para que un
    # cambio llegue solo sin que nadie haga nada.
    #
    # Y son ficheros de los que una copia vieja **no rompe la aplicación**: un favicon de
    # ayer se ve raro; un `main.dart.js` de ayer habla con una API de hoy.
    location / {
        add_header Cache-Control "public, max-age=86400";
        # UNA SOLA PÁGINA: cualquier ruta la resuelve el enrutador de Flutter dentro del
        # navegador. Sin esto, recargar en /rutas/3 da 404 y el logístico ve una página
        # de nginx en vez de su trabajo.
        #
        # Y va a @aplicacion, NO a /index.html directo. Ver ahí por qué.
        try_files $uri $uri/ @aplicacion;
    }

    # LA PUERTA SERVIDA POR UNA DIRECCIÓN QUE NO ES `index.html`.
    #
    # Aquí estuvo el agujero, y costó una mañana. Las reglas de arriba se eligen por
    # DIRECCIÓN: `^/(index\.html|version\.json|manifest\.json)$` sólo casa cuando el
    # navegador pide literalmente `/index.html`. Pero nadie pide eso: se entra por
    # `reparto.procovar.cloud/dashboard`, que no casa con ninguna regla de arriba y
    # cae en `location /` — o sea, se sirve la aplicación entera con **un día de
    # caché**.
    #
    # Resultado: se despliega, el servidor sirve el fichero nuevo, se comprueba byte a
    # byte que es el nuevo, y la persona sigue viendo el de ayer durante 24 horas
    # porque su navegador ni pregunta. Pasó el 16/09 con los colores: el `index.html`
    # servido tenía la huella nueva y la pantalla seguía en azul.
    #
    # `try_files /index.html =404` sirve el MISMO fichero, pero por esta puerta, que es
    # la que lleva el `no-cache`. `always` para que la cabecera salga también en el 404.
    location @aplicacion {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # Para el sondeo del desplegador y para poder distinguir «nginx está vivo» de «la
    # API no contesta», que desde la pantalla se parecen mucho.
    location = /nginx-salud {
        access_log off;
        default_type text/plain;
        return 200 "bien\n";
    }

    # AISLAMIENTO DE ORIGEN — apagado a propósito, y aquí está el porqué.
    #
    # Con estas dos cabeceras el navegador habilita SharedArrayBuffer y drift usa la
    # implementación compartida de OPFS. Sin ellas, drift se queda en OPFS con Web Locks,
    # que TAMBIÉN persiste: no se pierde nada, sólo se usa el camino de al lado.
    #
    # El riesgo de encenderlas es que `require-corp` bloquea cualquier recurso de otro
    # origen que no mande su permiso, y eso se ve como una pantalla en blanco sin error
    # entendible. Hoy el build va con `--no-web-resources-cdn` (CanvasKit es local) y la
    # aplicación no carga imágenes de fuera, así que se pueden encender — pero eso se
    # prueba en el navegador, mirando el aviso de «almacenamiento degradado» que la
    # propia aplicación escribe, y no se deja puesto «por si acaso».
    #
    # add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    # add_header Cross-Origin-Embedder-Policy "require-corp"  always;
}
