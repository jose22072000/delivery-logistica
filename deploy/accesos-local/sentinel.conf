# Centinela de DESARROLLO. Accesos (ioredis) SOLO sabe hablar por centinela:
# src/lib/redis.ts tira un error si REDIS_SENTINELS viene vacio.
port 26379
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
requirepass redis-local-de-mentira
sentinel monitor procovar redis 6379 1
sentinel auth-pass procovar redis-local-de-mentira
sentinel down-after-milliseconds procovar 5000
sentinel failover-timeout procovar 10000
