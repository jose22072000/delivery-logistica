<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- LA VERSION PEQUENA, para 16 y 32 px.
       No es el mismo dibujo encogido: `icono.svg` tiene las ruedas huecas y separadas del
       cuerpo, y a 16 px ese hueco desaparece y el camion se lee como una mancha con dos
       patas. Aqui es UNA SOLA SILUETA —caja, cabina y ruedas pegadas—, que es lo unico
       que aguanta a ese tamano. Comprobado a 16, 24, 32 y 48. -->
  <rect width="64" height="64" fill="#E0A52A"/>
  <g fill="#17130E">
    <path d="M6 16 H36 V26 H46 L58 36 V45 H6 Z"/>
    <circle cx="19" cy="47" r="5.5"/>
    <circle cx="47" cy="47" r="5.5"/>
  </g>
</svg>
