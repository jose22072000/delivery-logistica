<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- EL CAMION DEL REPARTO.
       Misma idea que la marca de PROCOVAR y la de PEDIDO —un cuadrado de color macizo con
       el dibujo encima— pero en ORO en vez de azul, y con un camion en vez del monograma
       VA. Asi se reconoce como de la casa y a la vez se distingue de las otras
       aplicaciones en la pantalla de un telefono.
       El dibujo va en TINTA y no en blanco: blanco sobre oro no tiene contraste para
       leerse a 16 px, que es donde vive un favicon.
       Son cuatro piezas grandes a proposito; a ese tamano un dibujo con detalle se
       convierte en una mancha. -->
  <rect width="64" height="64" fill="#E0A52A"/>
  <g fill="#17130E">
    <!-- La caja. -->
    <rect x="6" y="14" width="30" height="24" rx="1.5"/>
    <!-- La cabina, con el morro cortado. -->
    <path d="M40 22 h9 l9 9 v7 H40 z"/>
    <!-- Las ruedas. -->
    <circle cx="17" cy="44" r="6.5"/>
    <circle cx="48" cy="44" r="6.5"/>
  </g>
  <!-- El centro de la rueda es el fondo, no otro color: asi la rueda se lee como rueda y
       no como un punto macizo. -->
  <g fill="#E0A52A">
    <circle cx="17" cy="44" r="2.8"/>
    <circle cx="48" cy="44" r="2.8"/>
  </g>
</svg>
