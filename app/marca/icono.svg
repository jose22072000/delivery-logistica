<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- LA MARCA DEL REPARTO: un camion de PROCOVAR, con el monograma pintado en la caja.
       Es lo que pidio Jose: la idea del logo de PEDIDO —cuadrado de color macizo con el
       dibujo encima— pero en ORO en vez del azul `#054C74`, y con transporte.
       El monograma NO es un dibujo nuevo: son los seis trazos del logo de PROCOVAR tal
       cual, sacados de `delivery/public/favicon-claro.svg`, calados en la caja. Por eso
       esto no compite con el logo de la casa: ES el logo de la casa, encima de un camion,
       como va en la calle.
       El dibujo en TINTA y no en blanco: blanco sobre oro no se lee.
       ESTE FICHERO SOLO VALE DE 96 px PARA ARRIBA. Por debajo el monograma se convierte
       en una mancha dentro de la caja; ahi entra `icono-pequeno.svg`. Lo decide
       `generar.sh`, no quien lo llame. -->
  <rect width="64" height="64" fill="#E0A52A"/>
  <g fill="#17130E">
    <rect x="4" y="12" width="34" height="27" rx="1.5"/>
    <path d="M40 22 h9 l9 9 v8 H40 z"/>
    <circle cx="15" cy="45" r="6"/>
    <circle cx="48" cy="45" r="6"/>
  </g>
  <g fill="#E0A52A" transform="translate(6.45 10.95) scale(0.4545)">
    <rect x="12" y="10" width="6" height="44"/>
    <rect x="12" y="48" width="30" height="6"/>
    <path d="M22 54 L34 10 h7 L29 54 z"/>
    <path d="M34 54 L44 22 h6 v32 h-6 V34 l-4 20 z"/>
    <rect x="46" y="10" width="6" height="44"/>
    <rect x="22" y="10" width="30" height="5"/>
  </g>
</svg>
