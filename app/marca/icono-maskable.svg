<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- LA VERSION PARA ANDROID (`maskable`).
       Android recorta el icono con la forma que tenga el lanzador —circulo, cuadrado
       redondeado, gota— y lo que se sale se pierde. Por eso el dibujo va encogido al 60 %
       y centrado: cabe entero dentro del circulo del 80 % que la norma garantiza, y el
       oro llega hasta el borde para que el recorte no ensene esquinas transparentes. -->
  <rect width="64" height="64" fill="#E0A52A"/>
  <g transform="translate(12.8 12.8) scale(0.6)">
    <g fill="#17130E">
      <rect x="6" y="14" width="30" height="24" rx="1.5"/>
      <path d="M40 22 h9 l9 9 v7 H40 z"/>
      <circle cx="17" cy="44" r="6.5"/>
      <circle cx="48" cy="44" r="6.5"/>
    </g>
    <g fill="#E0A52A">
      <circle cx="17" cy="44" r="2.8"/>
      <circle cx="48" cy="44" r="2.8"/>
    </g>
  </g>
</svg>
