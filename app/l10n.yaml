# Configuracion de gen_l10n — PLAN.md §4.3.
#
# Los ARB viven en `lib/textos/arb/` y no en `lib/nucleo/i18n/arb/` como decia el
# borrador del PLAN: `lib/nucleo/` lo estan escribiendo otras manos a la vez y un
# fichero generado dentro de esa carpeta se pisa solo. La clase y las reglas son
# las mismas.
arb-dir: lib/textos/arb
template-arb-file: app_es.arb
output-localization-file: textos.dart
output-class: Textos
output-dir: lib/textos/generado
# Nada de getters que devuelvan null: si falta una clave se quiere que reviente
# al generar, no un hueco en blanco en la pantalla del almacen.
nullable-getter: false
