name: reparto
description: "reparto-app — la interfaz del reparto, web y APK del mismo codigo."
# Privado: nunca sale a pub.dev.
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.13.3

# Las versiones van EXACTAS, sin `^`, a proposito: una APK que se compila distinto
# en dos maquinas no se puede depurar (PLAN.md §1).
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # LAS DELEGACIONES DE MATERIAL. Sigue aqui aunque la traduccion al ingles se
  # quitara entera el 24/09/2026 (`lib/idioma.dart`), y no es un resto olvidado:
  # sin este paquete Flutter cae en `DefaultMaterialLocalizations`, que solo sabe
  # ingles, y los cinco calendarios de la aplicacion saldrian con `January` y
  # `Cancel` dentro de una pantalla en espanol. Lo vigila `test/idioma_test.dart`.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: 1.0.9

  # Estado — la fuente de verdad es la base local, no el widget.
  flutter_riverpod: 3.1.0
  riverpod_annotation: 4.0.0

  # Navegacion, con URL de verdad en web.
  go_router: 18.0.1

  # Base local — el MISMO Dart y el MISMO SQL en Android y en web.
  drift: 2.31.0
  drift_flutter: 0.2.8        # abre el fichero en Android, en un isolate aparte
  sqlite3_flutter_libs: 0.5.42 # SQLite embebido en el APK (minSdk 23)
  sqlite3: 2.9.4               # de aqui sale web/sqlite3.wasm
  path_provider: 2.1.6

  # HMAC-SHA256 para el fichero de la sesion del escritorio de Linux
  # (`nucleo/identidad/almacen_sesion_fichero.dart`). Ya venia de rebote con
  # otras dependencias; se pone explicita porque ahora se importa a proposito, y
  # exacta como todas.
  crypto: 3.0.7

  # Red — hace falta interceptor con candado, no un `http.get`.
  dio: 5.11.1

  # El par de tokens, SOLO en la APK. En web manda la cookie.
  flutter_secure_storage: 11.1.1

  synchronized: 3.4.2  # el Lock del candado de renovacion
  ulid: 2.0.1          # las claves de idempotencia (01J8…)
  uuid: 4.6.0          # los id provisionales local-…

  # Lo impreso — PLAN.md §4.1. `pdf` construye la hoja y `printing` la
  # previsualiza, la manda a imprimir y la comparte, en web y en Android.
  pdf: 3.13.0
  printing: 5.15.0

  intl: 0.20.3
  collection: 1.19.1
  web: 1.1.1           # nada de dart:html

  connectivity_plus: 7.3.1   # PISTA de que hay red, nunca la verdad
  device_info_plus: 13.2.0   # el nombre del aparato para POST /sync/aparato
  package_info_plus: 10.2.1

  # Las tres tipografias de delivery (Bricolage Grotesque, Hanken Grotesk y
  # JetBrains Mono). Los .ttf van EMBEBIDOS en `assets/google_fonts/`: el
  # paquete mira ahi primero y no sale a la red, que es lo unico que sirve en el
  # patio de un almacen. La version, exacta como todas.
  google_fonts: 8.2.1
  # Abrir OTRA aplicacion de Procovar desde el menu de la cuenta, y **abrir la
  # ruta en Google Maps** desde el detalle de Rutas. Hace falta un plugin porque
  # el mismo codigo corre en web y en la APK: en web es una pestana nueva, en
  # Android es la aplicacion de Google Maps. La version, exacta.
  url_launcher: 6.3.2

  # COMPARTIR la ruta con el chofer: el cajon de compartir del sistema.
  #
  # Por que un plugin y no `url_launcher` a secas: el boton de WhatsApp SI se
  # resuelve con un enlace `wa.me` y no necesita nada (y asi esta hecho, ver
  # `rutas/datos/abrir_y_compartir.dart`), pero «lo que ofrezca el aparato» —el
  # cajon con Telegram, el correo, Archivos, Bluetooth— es un `Intent` de
  # Android y `navigator.share` en el navegador, y eso no se alcanza desde Dart
  # puro. Es el unico plugin que hace falta para esto; el mapa NO trae ninguna
  # biblioteca de mapas, se dibuja con un `CustomPainter` (ver
  # `rutas/vista/croquis_de_ruta.dart`).
  #
  # Trae los seis destinos (android, ios, linux, macos, web, windows), asi que
  # no rompe ni la web ni el escritorio. La version, exacta como todas.
  share_plus: 13.3.0

  # EXPORTAR A EXCEL (pliego §7). **Las dos ya estaban en el arbol** como
  # dependencias transitivas de `pdf`/`printing` y en las mismas versiones que
  # aqui: esto no baja ni un paquete nuevo, solo hace explicito lo que ya se
  # usa. Un `.xlsx` es un zip de XML y eso es exactamente lo que estas dos
  # hacen, en Dart puro y en los seis destinos.
  #
  # Por que NO el paquete `excel`, que era lo que decia el comentario viejo de
  # `pantalla_informes.dart`: `excel` 4.0.6 pide `archive ^3.6.1` y
  # `xml >=5 <7`, y este arbol resuelve hoy `archive 4.0.9` y `xml 7.0.1`
  # porque se los pide `printing`. Meterlo obligaria a BAJAR las dos por debajo
  # de lo que necesita lo impreso — que es lo que sale por la impresora del
  # almacen todos los dias— para ganar un escritor de hojas de 200 lineas. El
  # escritor esta en `pantallas/informes/datos/hoja_de_calculo.dart`, escribe el
  # OOXML minimo y se lee de vuelta en sus pruebas.
  #
  # `file_saver`, el otro paquete del comentario viejo, tampoco hace falta: la
  # entrega ya la resuelven `share_plus` (APK), `dart:io` + `path_provider`
  # (escritorio) y un `Blob` con `package:web` (navegador). Ver
  # `datos/entrega_del_excel.dart`.
  archive: 4.0.9
  xml: 7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  build_runner: 2.15.1
  drift_dev: 2.31.0
  riverpod_generator: 4.0.0+1
  riverpod_lint: 3.1.0
  custom_lint: 0.8.1
  json_serializable: 6.11.2
  mocktail: 1.0.5
  http_mock_adapter: 0.6.1   # el servidor falso para los tests de red

flutter:
  uses-material-design: true
  # SIN `generate: true`. Era solo para gen_l10n, y gen_l10n se fue con la
  # traduccion al ingles el 24/09/2026: no quedan `.arb` ni `l10n.yaml` que
  # generar. Dejarlo puesto hacia que `flutter pub get` buscara un `l10n.yaml`
  # que ya no existe.

  assets:
    # Roboto EMBEBIDA para el PDF: `PdfGoogleFonts` la baja por red y esto se
    # imprime en el patio de un almacen, sin senal (PLAN.md §4.1).
    - assets/fuentes/
    # Las tres familias de delivery, con el nombre que `google_fonts` busca en
    # el manifiesto (`Familia-Peso.ttf`). Con esto `allowRuntimeFetching = false`
    # y la aplicacion nunca pide una tipografia por red.
    - assets/google_fonts/
    # La marca. Salen de `marca/*.svg` con `marca/generar.sh`, que decide cual
    # segun el tamano: `logo.png` lleva el monograma de PROCOVAR calado en la
    # caja del camion y vale de 96 px para arriba; `isotipo.png` es la silueta
    # sola, para los 36 px de la barra lateral.
    - assets/marca/
