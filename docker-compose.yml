# EL REPARTO ENTERO EN LA MÁQUINA DE UNO. Para probar de verdad, no para producción.
#
#   docker compose up --build        levanta todo y deja los registros a la vista
#   docker compose up -d --build     lo mismo, por detrás
#   docker compose down              para todo; la base se queda
#   docker compose down -v           para todo Y BORRA LA BASE
#
# Cuando esté arriba:
#
#   la web           http://localhost:8082
#   la API           http://localhost:8080/health   y  /version
#   el sincronizador http://localhost:8081/salud
#   el espejo        no tiene puerto: `docker compose logs -f espejo`
#                    una pasada suelta, sin esperar al ciclo, y contándola entera:
#                    `docker compose run --rm espejo --once`
#   Postgres         localhost:5433  usuario/clave `reparto` / `reparto`
#
# En producción NO se usa este fichero: allí cada pieza es una Application de Dokploy y
# el Postgres es el único que ya hay para toda la casa. Ver docs/despliegue.md.
name: reparto

# Los valores de aquí son de DESARROLLO y están escritos a la vista a propósito: un
# fichero de pruebas con secretos de verdad acaba en un repositorio. Para apuntar a
# PEDIDO o a Accesos de verdad, poner las que hagan falta en un `.env` al lado de este
# fichero (está en .gitignore) y no tocar esto.
x-base-reparto: &base-reparto
  postgres://reparto:reparto@postgres:5432/reparto?sslmode=disable

services:

  # ---------------------------------------------------------------------------
  # Postgres. UNO, con DOS bases dentro (deploy/postgres-init/01-bases.sql).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reparto
      POSTGRES_PASSWORD: reparto
      POSTGRES_DB: reparto
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    # A 127.0.0.1 y en 5433: para poder mirar con psql o con DBeaver sin chocar con el
    # Postgres que pueda haber instalado en la máquina, y sin abrirlo a la red de casa.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reparto -d reparto"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Las migraciones. Arranca, migra las DOS bases y se muere. Nadie más migra.
  # ---------------------------------------------------------------------------
  migraciones:
    build:
      context: .
      dockerfile: deploy/Dockerfile.migraciones
    environment:
      DATABASE_URL_API: *base-reparto
      DATABASE_URL_SYNC: postgres://reparto:reparto@postgres:5432/reparto_sync?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    # Que NO se reinicie: si una migración falla, tiene que quedarse caída y a la vista.
    restart: "no"

  # ---------------------------------------------------------------------------
  # La API. UNA SOLA RÉPLICA — ver docs/despliegue.md §«Una sola réplica».
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      args:
        VERSION: ${VERSION:-local}
    environment:
      ENTORNO: desarrollo
      PUERTO: "8080"
      DATABASE_URL: *base-reparto
      # 32 caracteres como mínimo o no arranca. En producción es EL MISMO con el que
      # firma auth.procovar.cloud; éste es de juguete y sólo vale contra un auth falso.
      JWT_SECRET: ${JWT_SECRET:-secreto-de-desarrollo-de-mas-de-32-caracteres}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-clave-de-servicio-local}
      # De dónde puede llamar el navegador. Lista cerrada: con `*` no viajan las cookies
      # y la sesión de la web es una cookie.
      ORIGENES_PERMITIDOS: ${ORIGENES_PERMITIDOS:-http://localhost:8082}
      # Vacías = «no configurado», y el servicio lo DICE en el registro al arrancar en
      # vez de callárselo. Para probar el canal hacia PEDIDO, ponerlas en un `.env`.
      PEDIDO_API_URL: ${PEDIDO_API_URL:-}
      DELIVERY_URL: ${DELIVERY_URL:-}
      PROCOVAR_AUTH_URL: ${PROCOVAR_AUTH_URL:-https://auth.procovar.cloud}
      PROCOVAR_AUTH_CLIENT_ID: ${PROCOVAR_AUTH_CLIENT_ID:-delivery}
      PROCOVAR_AUTH_SIGNING_KEY: ${PROCOVAR_AUTH_SIGNING_KEY:-}
      # El anuncio de versión de la APLICACIÓN, que es lo que leen los aparatos para saber
      # si tienen que actualizarse. A MEDIAS NO ARRANCA: una URL sin `APP_ULTIMA_VERSION`
      # no se anunciaría nunca, y al revés se avisaría sin decir de dónde bajarla. Ver
      # docs/actualizaciones.md.
      #
      # ESTOS VALORES NO SON DE DESARROLLO Y NO SE INVENTAN: son los del APK que está
      # colgado de verdad en MinIO, medidos DENTRO del servidor el 22/09/2026
      # (docs/actualizaciones.md §3-bis). Están aquí porque este fichero es el único sitio
      # del repositorio donde el canal de actualización se puede leer entero, y porque los
      # MISMOS tres datos son los que van en el Environment de `reparto-api` en Dokploy.
      # Una prueba los lee de aquí y exige que el anuncio salga completo
      # (`api/internal/config/config_test.go`, TestElComposeAnuncia…): vaciar una línea de
      # éstas deja la suite en rojo en vez de dejar el canal muerto en silencio.
      #
      # Estuvieron vacías hasta el 24/09/2026 y eso ya no es «el estado seguro»: el estado
      # seguro era mientras no hubiera fichero colgado, y desde el 22/09 lo hay. Vacío
      # ahora significa que un aparato en la calle nunca se entera de que hay versión
      # nueva — y la aplicación se usa sin señal la mayor parte del día.
      APP_ULTIMA_VERSION: ${APP_ULTIMA_VERSION:-1.0.1}
      APP_ULTIMA_COMPILACION: ${APP_ULTIMA_COMPILACION:-2}
      APP_ULTIMA_NOTAS: ${APP_ULTIMA_NOTAS:-}
      APP_ULTIMA_PUBLICADA: ${APP_ULTIMA_PUBLICADA:-2026-09-22}
      # Los TRES juntos o ninguno: URL, BYTES y SHA256. Sin BYTES quien la baja por datos
      # móviles ve «30 MB/?» —Cloudflare quita el Content-Length— y sin SHA256 una descarga
      # cortada pasa por buena.
      APP_DESCARGA_ANDROID: ${APP_DESCARGA_ANDROID:-https://archivos.procovar.cloud/reparto/apk/reparto-1.0.1-260922.apk}
      APP_DESCARGA_ANDROID_BYTES: ${APP_DESCARGA_ANDROID_BYTES:-77646816}
      APP_DESCARGA_ANDROID_SHA256: ${APP_DESCARGA_ANDROID_SHA256:-565647928d03200b2eda25ef28bde55e0f0d3e034f99d561f38b33a6aa47c49e}
      # Windows y Linux siguen SIN COLGAR. No se inventa una URL que no tiene fichero
      # detrás: un enlace roto en la pantalla de alguien es peor que no ofrecer nada.
      APP_DESCARGA_WINDOWS: ${APP_DESCARGA_WINDOWS:-}
      APP_DESCARGA_LINUX: ${APP_DESCARGA_LINUX:-}
      # La única forma de dejar el canal callado en producción, y hay que ESCRIBIRLA:
      # con ENTORNO=produccion y sin `APP_ULTIMA_VERSION`, la api no arranca. Aquí no hace
      # falta porque el entorno es desarrollo. Ver api/internal/config/config.go.
      APP_SIN_ANUNCIO: ${APP_SIN_ANUNCIO:-}
      # El paquete de MAPA de Cuba que la APK y el escritorio se guardan para
      # dibujar el mapa sin conexión. Es el mismo mecanismo de arriba y la misma
      # regla: A MEDIAS NO ARRANCA. De cada nivel van las TRES —URL, BYTES y
      # SHA256— o ninguna: sin BYTES se baja a ciegas y sin SHA256 no hay forma
      # de saber si llegó entero, y una descarga de 26 MB que se corta al 60 %
      # y se da por buena es el fallo de los 2.000 clientes otra vez.
      # Vacías = no se anuncia ningún mapa y ningún aparato ofrece descargar
      # nada, que es lo correcto mientras no haya un .pmtiles colgado de verdad.
      # Cómo se generan y se cuelgan: docs/mapa-sin-conexion.md.
      MAPA_VERSION: ${MAPA_VERSION:-}
      MAPA_FECHA: ${MAPA_FECHA:-}
      MAPA_BASICO_URL: ${MAPA_BASICO_URL:-}
      MAPA_BASICO_BYTES: ${MAPA_BASICO_BYTES:-}
      MAPA_BASICO_SHA256: ${MAPA_BASICO_SHA256:-}
      MAPA_COMPLETO_URL: ${MAPA_COMPLETO_URL:-}
      MAPA_COMPLETO_BYTES: ${MAPA_COMPLETO_BYTES:-}
      MAPA_COMPLETO_SHA256: ${MAPA_COMPLETO_SHA256:-}
      MAPA_DETALLADO_URL: ${MAPA_DETALLADO_URL:-}
      MAPA_DETALLADO_BYTES: ${MAPA_DETALLADO_BYTES:-}
      MAPA_DETALLADO_SHA256: ${MAPA_DETALLADO_SHA256:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migraciones:
        condition: service_completed_successfully
    # UNA. El bus de `/api/eventos` vive en la memoria de este proceso: con dos, la mitad
    # de las pantallas deja de recibir avisos y no aparece ni un error en ningún sitio.
    deploy:
      replicas: 1
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # El espejo de PEDIDO. Proceso de fondo: ni puerto, ni dominio, ni /health.
  #
  # VIVE, no es un trabajo: sin `--once` da vueltas hasta que lo paren, y el ciclo lo
  # lleva él dentro (`SYNC_POLL_MS`). Por eso `restart: unless-stopped` como los demás
  # servicios y no `restart: "no"` como `migraciones`, que sí termina. Lo mismo vale en
  # Dokploy: allí es una Application, y las migraciones no. Ver docs/despliegue.md §2-bis,
  # que cuenta además qué se rompe el día que deje de correr — el tablero se queda con los
  # pedidos de la última pasada y no lo dice nadie.
  # ---------------------------------------------------------------------------
  espejo:
    build:
      context: .
      dockerfile: deploy/Dockerfile.espejo
    environment:
      ENTORNO: desarrollo
      DATABASE_URL: *base-reparto
      # La MISMA que la de la API: con ella firma hacia PEDIDO y con ella entra a
      # /api/quote/batch. Si no coinciden, el espejo trae los pedidos y no los mete.
      SERVICE_API_KEY: ${SERVICE_API_KEY:-clave-de-servicio-local}
      # Sin un PEDIDO de verdad detrás, el ciclo da vueltas y falla cada minuto contra
      # esta dirección. Es lo correcto: no se inventa nada y se ve en el registro.
      PEDIDO_API_URL: ${PEDIDO_API_URL:-http://pedido-api:8400}
      # Aquí SÍ hay que decirlo: «vacía = a mí mismo» es el proceso de la API, y este
      # proceso no es la API. Se habla con ella por el nombre del servicio.
      DELIVERY_URL: http://api:8080
      # Los tiempos y los topes tienen valores medidos (api/internal/espejo/opciones.go).
      # Se tocan sólo si hay un motivo, y el motivo se escribe.
      SYNC_POLL_MS: ${SYNC_POLL_MS:-60000}
    depends_on:
      migraciones:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # El sincronizador. Su propia base; los datos se los pide a la API.
  # ---------------------------------------------------------------------------
  sync:
    build:
      context: .
      dockerfile: deploy/Dockerfile.sync
    environment:
      DATABASE_URL: postgres://reparto:reparto@postgres:5432/reparto_sync?sslmode=disable
      SYNC_ADDR: ":8081"
      REPARTO_URL: http://api:8080
      REPARTO_API_KEY: ${SERVICE_API_KEY:-clave-de-servicio-local}
      # `token`, igual que producción. **No vuelvas a poner `cabeceras` aquí.**
      #
      # Ese modo saca la identidad de unas cabeceras que «pone el proxy que verifica el
      # token delante de este servicio», y ese proxy NO EXISTE: Traefik enruta directo al
      # contenedor. Así que `X-Persona` llegaba siempre vacía y el servicio contestaba 401
      # a todo — y el cliente trata un 401 que sobrevive a renovar como «la sesión murió»,
      # o sea que echaba a la persona a la pantalla de acceso justo cuando volvía la señal,
      # con el día del almacén dentro del teléfono. Visto el 16/09/2026.
      #
      # Y hay una segunda razón desde ese mismo día: en `cabeceras` la identidad no trae
      # token, así que `reparto-sync` no tiene qué reenviarle al reparto y la cola del
      # tablero vuelve a recibir 401 «no viene token». El modo viejo no es sólo peor: es el
      # camino roto, y dejarlo en el compose hacía que el entorno local se comportara
      # distinto del servidor sin decir una palabra.
      #
      # Con `token` este servicio verifica el JWT de auth él mismo: misma firma, mismo
      # secreto y mismas reglas de alcance que `reparto-api`. Ver sync/internal/identidad.
      SYNC_IDENTIDAD: ${SYNC_IDENTIDAD:-token}
      # EL MISMO que el de `api` de aquí arriba, y no es un detalle: `reparto-sync`
      # verifica el token que firmó auth, así que dos secretos distintos en el mismo
      # compose dan 401 en todo sin decir por qué.
      JWT_SECRET: ${JWT_SECRET:-secreto-de-desarrollo-de-mas-de-32-caracteres}
      SYNC_TOPE_BAJADA: ${SYNC_TOPE_BAJADA:-500}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      migraciones:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # La web. Estáticos servidos por nginx; las URL van HORNEADAS en el build.
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
      args:
        # Las ve el NAVEGADOR, no el contenedor: por eso `localhost` y los puertos
        # publicados, y no `http://api:8080`, que desde el navegador no existe.
        API_URL: ${API_URL:-http://localhost:8080/api}
        SYNC_URL: ${SYNC_URL:-http://localhost:8081/sync}
        AUTH_URL: ${AUTH_URL:-https://auth.procovar.cloud}
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres:
